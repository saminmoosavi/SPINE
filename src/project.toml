[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spine"
version = "0.0.1"
description = "SPINE semantic planner core library"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "BSD-3-Clause"}

authors = [
  { name="Kumar Robotics", email="" }
]



[tool.setuptools.packages.find]
where = ["."]
